[project]
name = "kviewer"
version = "0.1.0"
description = "A Kubernetes companion CLI that provides quick cluster snapshots and useful visibility into cluster states."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=35.0.0",
    "pytest>=9.0.3",
    "tabulate>=0.10.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
kviewer = "kviewer.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
