<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>{{ title }}</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th,
            td {
                border: 1px solid #ddd;
                padding: 8px;
            }

            th {
                background: #f2f2f2;
            }

            tr:nth-child(even) {
                background: #f9f9f9;
            }
        </style>
    </head>
    <body>
        <h1>{{ title }}</h1>

        {{ table }}

        <p>
            <strong>{{ total }}</strong>
        </p>
    </body>
</html>
