# Sample kubeconfig fixture
apiVersion: v1
kind: Config
preferences: {}

clusters:
  - name: dev-cluster
    cluster:
      server: https://10.0.0.10:6443
      certificate-authority-data: FAKE_DEV_CERT

  - name: staging-cluster
    cluster:
      server: https://10.0.1.10:6443
      certificate-authority-data: FAKE_STAGING_CERT

  - name: prod-cluster
    cluster:
      server: https://10.0.2.10:6443
      certificate-authority-data: FAKE_PROD_CERT

users:
  - name: alice
    user:
      token: fake-token-alice

  - name: bob
    user:
      token: fake-token-bob

  - name: ci-service-account
    user:
      token: fake-token-ci

contexts:
  - name: dev-alice
    context:
      cluster: dev-cluster
      user: alice
      namespace: default

  - name: staging-bob
    context:
      cluster: staging-cluster
      user: bob
      namespace: backend

  - name: prod-ci
    context:
      cluster: prod-cluster
      user: ci-service-account
      namespace: kube-system

current-context: dev-alice
